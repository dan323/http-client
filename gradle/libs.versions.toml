[versions]
kotlin = "2.2.20"
kotlinx-serialization = "1.9.0"
compose-multiplatform = "1.12.2"
intellij-platform = "2.19.0"
pitest-plugin = "1.19.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
sonarqube = { id = "org.sonarqube", version = "7.5.0.8588" }
