# SonarCloud analysis, run from CI (the `quality` job) after :quality-reports:qualityReports, so the pull request
# gets coverage. It needs the SONAR_TOKEN repository secret and "Automatic Analysis" switched off for the project
# in SonarCloud (the two analysis modes cannot run together). See docs/ci-sonar.md.
sonar.projectKey=dan323_http-client
sonar.organization=dan323

sonar.sources=core/src/main,adapters/src/main,view-model/src/main,cli/src/main,desktop/src/main,intellij-plugin/src/main,mock-server/src/main
sonar.tests=core/src/test,adapters/src/test,view-model/src/test,cli/src/test,desktop/src/test,intellij-plugin/src/test,mock-server/src/test
sonar.java.binaries=*/build/classes/kotlin/main,*/build/classes/java/main
sonar.java.test.binaries=*/build/classes/kotlin/test,*/build/classes/java/test

# Merged JaCoCo report of all modules (written by :quality-reports:qualityReports).
sonar.coverage.jacoco.xmlReportPaths=quality-reports/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
